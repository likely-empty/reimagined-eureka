<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐 · 愿你岁岁欢喜</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ink:#f3ecff}
  html,body{height:100%}
  body{
    min-height:100vh;
    font-family:"Microsoft Yahei",serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 20% 12%, #3b2d63 0%, transparent 50%),
      radial-gradient(circle at 85% 85%, #24306b 0%, transparent 50%),
      linear-gradient(165deg,#0b1026 0%,#171a3d 50%,#241b47 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;position:relative;padding:24px;
  }
  .glow{position:absolute;border-radius:50%;filter:blur(50px);opacity:.4;z-index:0}
  .glow.a{width:240px;height:240px;background:#6a5bb0;top:-70px;left:-60px}
  .glow.b{width:280px;height:280px;background:#3f5aa8;bottom:-90px;right:-70px}

  .star{position:absolute;border-radius:50%;background:#fff;z-index:0;pointer-events:none;
    animation:twinkle ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.25}to{opacity:.95}}

  .float{position:absolute;top:-30px;z-index:1;opacity:.7;animation:fall linear infinite;pointer-events:none}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);opacity:0}
    10%{opacity:.8}
    100%{transform:translateY(110vh) rotate(360deg);opacity:0}
  }

  .card{
    position:relative;z-index:2;width:100%;max-width:420px;
    background:rgba(255,255,255,.1);backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.22);border-radius:28px;
    padding:40px 30px 34px;text-align:center;
    box-shadow:0 20px 50px rgba(10,10,40,.45);animation:rise .9s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

  .cake{font-size:58px;line-height:1;display:block;margin-bottom:14px;animation:bounce 2.4s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:900;letter-spacing:.12em;margin-bottom:10px;
    background:linear-gradient(120deg,#ffd9a8,#ff9ec7);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-weight:300;font-size:.95rem;color:#c9bfe6;margin-bottom:22px;letter-spacing:.05em}

  .wish{font-size:1.08rem;line-height:2;min-height:3.2em;color:#efe9ff}
  .wish .hl{color:#ffb3d1;font-weight:600}
  .wish.swap{animation:fadeIn .8s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .candles{display:flex;justify-content:center;gap:18px;margin:22px 0 6px}
  .cd{position:relative;width:10px;height:34px;border-radius:4px;
    background:linear-gradient(180deg,#fff,#ffe0d8);box-shadow:inset 0 0 3px rgba(0,0,0,.08)}
  .flame{position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    width:12px;height:18px;background:radial-gradient(circle at 50% 70%,#ffe27a,#ff9a3c 70%);
    border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:flick .18s ease-in-out infinite alternate;transform-origin:bottom center}
  @keyframes flick{from{transform:translateX(-50%) scale(1) rotate(-3deg)}to{transform:translateX(-50%) scale(1.12) rotate(3deg)}}
  .out .flame{animation:none;opacity:0;transition:opacity .4s}
  .out .cd{background:linear-gradient(180deg,#e9d8d2,#d9c3bc)}

  .btn{margin-top:18px;border:none;cursor:pointer;padding:13px 34px;border-radius:999px;
    font-size:1rem;letter-spacing:.1em;color:#fff;
    background:linear-gradient(120deg,#ff8a75,#f4709a);
    box-shadow:0 10px 24px rgba(244,112,154,.35);transition:transform .2s,box-shadow .2s}
  .btn:active{transform:scale(.95)}
  .btn.done{background:#e7c9bf;box-shadow:none}

  .foot{margin-top:22px;font-size:.8rem;color:#a99ccf;z-index:2;letter-spacing:.08em}
  .confetti{position:fixed;top:0;z-index:5;border-radius:50%;pointer-events:none}

  .shoot{position:fixed;z-index:1;width:80px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,0));
    transform:rotate(-38deg);pointer-events:none;box-shadow:0 0 6px rgba(255,240,220,.8)}
  .shoot::before{content:'';position:absolute;right:0;top:50%;transform:translateY(-50%);
    width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,235,200,.9)}
</style>
</head>
<body>
  <div class="glow a"></div>
  <div class="glow b"></div>

  <main class="card" id="card">
    <span class="cake">🎂</span>
    <h1>生日快乐</h1>
    <p class="sub">愿新的一岁 · 温柔且有力量</p>

    <div class="candles" id="candles">
      <div class="cd"><div class="flame"></div></div>
      <div class="cd"><div class="flame"></div></div>
      <div class="cd"><div class="flame"></div></div>
    </div>

    <p class="wish" id="wish">
      愿你眼里有星光，脚下有远方，<br>
      走过的路都算数，<span class="hl">想见的人、想做的事，都如愿以偿</span>。
    </p>

    <button class="btn" id="wishBtn">许个愿吧 🕯️</button>
  </main>

  <p class="foot">岁岁常欢愉 · 年年皆胜意</p>

<script>
  const box=document.body;
  // 静态星空
  for(let i=0;i<70;i++){
    const st=document.createElement("div");
    st.className="star";
    const size=1+Math.random()*2.2;
    st.style.width=size+"px";st.style.height=size+"px";
    st.style.left=Math.random()*100+"vw";
    st.style.top=Math.random()*100+"vh";
    st.style.animationDuration=(1.5+Math.random()*3)+"s";
    st.style.animationDelay=Math.random()*3+"s";
    box.appendChild(st);
  }

  // 漂浮爱心 / 花瓣
  const icons=["💗","🌸","✨","🍑","🤍"];
  for(let i=0;i<16;i++){
    const f=document.createElement("span");
    f.className="float";
    f.textContent=icons[Math.floor(Math.random()*icons.length)];
    f.style.left=Math.random()*100+"vw";
    f.style.fontSize=(14+Math.random()*16)+"px";
    f.style.animationDuration=(7+Math.random()*8)+"s";
    f.style.animationDelay=(Math.random()*8)+"s";
    box.appendChild(f);
  }

  // 流星划过
  function shooting(){
    const s=document.createElement("div");
    s.className="shoot";
    const startX=40+Math.random()*60;
    const startY=-5+Math.random()*20;
    s.style.left=startX+"vw";
    s.style.top=startY+"vh";
    document.body.appendChild(s);
    const dur=1.1+Math.random()*0.7;
    s.animate([
      {transform:"translate(0,0) rotate(-38deg)",opacity:1},
      {transform:"translate(-38vw,55vh) rotate(-38deg)",opacity:0}
    ],{duration:dur*1000,easing:"ease-out"});
    setTimeout(()=>s.remove(),dur*1000);
  }
  shooting();
  setInterval(()=>{ if(Math.random()>0.3) shooting(); },2600);

  let done=false;
  const btn=document.getElementById("wishBtn");
  const candles=document.getElementById("candles");
  const wish=document.getElementById("wish");

  function confetti(){
    for(let i=0;i<50;i++){
      const c=document.createElement("div");
      c.className="confetti";
      const size=6+Math.random()*8;
      c.style.width=size+"px";c.style.height=size+"px";
      c.style.background=`hsl(${Math.random()*360},80%,70%)`;
      c.style.left=Math.random()*100+"vw";
      c.style.top="-10px";
      document.body.appendChild(c);
      const dur=1.4+Math.random()*1.2;
      c.animate([
        {transform:"translateY(0) rotate(0deg)",opacity:1},
        {transform:`translateY(110vh) rotate(${Math.random()*360}deg)`,opacity:0}
      ],{duration:dur*1000,easing:"ease-out"});
      setTimeout(()=>c.remove(),dur*1000);
    }
  }

  // 许愿后送出的祝福语（逐条轮播）
  const blessings=[
    "愿望已经悄悄记下啦 ✨",
    "愿你<span class='hl'>被爱包围，被好运偏爱</span>，平安喜乐，得偿所愿。",
    "新的一岁，所求皆如愿，所行皆坦途。",
    "眼里有光，心中有爱，日子温柔又闪亮。",
    "愿你想要的都拥有，错过的都释怀。",
    "生日快乐，往后每一天都比今天更开心 💐"
  ];

  let bIdx=0;
  function showBlessing(){
    wish.classList.remove("swap");
    void wish.offsetWidth;
    wish.innerHTML=blessings[bIdx];
    wish.classList.add("swap");
    bIdx=(bIdx+1)%blessings.length;
  }

  btn.addEventListener("click",()=>{
    if(done)return;
    done=true;
    candles.classList.add("out");
    confetti();
    showBlessing();
    setInterval(showBlessing,3000);
    btn.textContent="愿望已送达 💌";
    btn.classList.add("done");
  });
</script>
</body>
</html>
